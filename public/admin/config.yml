backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "المقالات"
    folder: "blog"
    create: true
    fields:
      - { label: "العنوان", name: "title", widget: "string" }
      - { label: "التاريخ", name: "date", widget: "datetime" }
      - { label: "القسم", name: "category", widget: "select", options: ["Aviation", "Technology", "Projects"] }
      - { label: "المحتوى", name: "body", widget: "markdown" }
